[project]
name = "f1sim"
dynamic = ["version", "readme"]
description = "Shpeed: an open-source, lap-by-lap Monte Carlo F1 race simulator"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Shpeed contributors" }]
maintainers = [{ name = "Emmanuel Terah" }]
keywords = [
  "formula-1",
  "f1",
  "motorsport",
  "monte-carlo",
  "simulation",
  "forecasting",
  "bayesian",
  "fastf1",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
# Everything the CLI imports is a core dependency, so `pip install f1sim` gives a working
# `f1sim` command and every module can import its packages at the top of the file.
dependencies = [
  # fastf1 requires pandas<3; pandas 2.x warns on numpy 2.5+ timedelta handling
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "typer>=0.12",
  "fastf1>=3.8",
  # Pinned: the DuckLake catalog format follows DuckDB releases (ADR-0002)
  "duckdb==1.5.5",
  "pandera>=0.34",
  "pyarrow>=16",
  "httpx>=0.27",
  "filelock>=3.15",
  "pytz>=2024.1",
  # Statistical models (Phases 3-6): NumPyro on JAX (ADR-0003) and statsmodels.
  # Core, not an extra: the CLI imports them at the top of cli.py, so a plain
  # `pip install f1sim` must give a working command.
  "numpyro>=0.18",
  "jax>=0.5",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
# Read-only API (Phase 8): `pip install "f1sim[api]"` to run `f1sim.api.app`
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/emmanuelterah/Shpeed"
Repository = "https://github.com/emmanuelterah/Shpeed"
Issues = "https://github.com/emmanuelterah/Shpeed/issues"
Changelog = "https://github.com/emmanuelterah/Shpeed/blob/main/CHANGELOG.md"
Documentation = "https://github.com/emmanuelterah/Shpeed/blob/main/ARCHITECTURE.md"

[project.scripts]
f1sim = "f1sim.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pylint>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  # Engine performance benchmark (P5-11): 10,000 runs of one race under a minute
  "pytest-benchmark>=5.1",
  "import-linter>=2.1",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "pandas-stubs>=2.2,<4",
  # Official, signature-checked DuckLake binary as a wheel, so tests run without
  # downloading extensions. Production installs it with INSTALL ducklake.
  "duckdb-extension-ducklake==1.5.5",
  "types-pyyaml>=6.0",
  "twine>=6.1",
  "check-wheel-contents>=0.6",
  # The `api` extra, repeated here so a plain `uv sync` gives the strict type-check and
  # full test suite everything they import. CI uses `--all-extras`; a library user still
  # installs only the extras they want.
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
# Research notebook (Phase 7, P7-04): the regulation-reset study executes in CI from a clean
# environment. Kept out of `dev` so the test suite stays fast and does not need Jupyter.
research = [
  "jupyter-client>=8.6",
  "jupyter-core>=5.7",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "matplotlib>=3.9",
]

[tool.uv]
# signalrcore 1.0.2 (used only by FastF1's live-timing client, which Shpeed does not use) pins
# msgpack==1.1.2, which has PYSEC-2026-3625. Override to the fixed release for every install
# uv makes (dev, CI, Docker). Remove once signalrcore relaxes its pin.
override-dependencies = ["msgpack>=1.2.1"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/f1sim/__init__.py"

# The PyPI page is built from README.md, with relative links rewritten to GitHub so they
# still work there (PyPI cannot resolve links to other files in the repository).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/emmanuelterah/Shpeed/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/f1sim"]

[tool.hatch.build.targets.sdist]
# Ship only what builds and tests the package; the frontend, docs and data stay in the repo
# Leading slashes anchor each pattern to the repository root
include = [
  "/src/f1sim",
  "/tests",
  "/typings",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Notebooks are executed research artefacts, not package code; the logic they use lives in the
# package with tests (notebooks/README.md). CI still executes the notebook (P7-04).
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PT", "PL", "C4", "TID",
  "D",  # pydocstyle, Google convention below
]
ignore = ["PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
# Ruff does not count trailing pragma comments (# noqa, # type: ignore) towards line length,
# so pylint and scripts/check_line_length.py also enforce the 100-character limit.
max-line-length = 100

[tool.ruff.lint.per-file-ignores]
# Test functions are documented by their names; modules, classes and helpers still need
# docstrings (pylint enforces the helpers through no-docstring-rgx in tests/pylintrc).
"tests/**" = ["PLR2004", "D103"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ------------------------------------------------------------------ pylint
[tool.pylint.main]
py-version = "3.12"
jobs = 0
load-plugins = ["pylint.extensions.docparams", "pylint.extensions.docstyle"]
ignore-paths = ["^\\.venv/.*$"]
extension-pkg-allow-list = ["duckdb", "pydantic"]

[tool.pylint.format]
max-line-length = 100
# No exceptions, not even for URLs: every line stays within 100 characters
ignore-long-lines = "^$"

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "df", "e", "s", "t", "r", "p", "f", "_"]
# Public modules, classes, functions and methods need docstrings; private (_x) ones do not
no-docstring-rgx = "^_"

[tool.pylint.design]
max-args = 7
max-positional-arguments = 5
max-attributes = 10
# Protocols and dataclasses legitimately have one public method, or none
min-public-methods = 0

[tool.pylint.parameter_documentation]
# Google-style Args/Returns/Raises sections are required on every public function
default-docstring-type = "google"
accept-no-param-doc = false
accept-no-raise-doc = false
accept-no-return-doc = false
accept-no-yields-doc = false

[tool.pylint."messages control"]
# Duplicates of checks ruff or pyright already make, kept in one place to avoid double reports
disable = [
  "wrong-import-order",     # ruff I (isort)
  "ungrouped-imports",      # ruff I (isort)
  "unused-import",          # ruff F401
  "import-error",           # pyright resolves imports
  "no-name-in-module",      # pyright
]

[tool.pylint.reports]
score = true

# ------------------------------------------------------------------ pyright (also used by Pylance)
[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src", "scripts"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
stubPath = "typings"
reportMissingImports = "error"

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=f1sim --cov-report=term-missing"
filterwarnings = [
  # Raised inside fastapi.testclient by the installed Starlette; not Shpeed code
  "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
  "integration: replays recorded source responses; network is blocked",
  "perf: performance benchmarks, run on model and engine PRs",
  "contract: shared test suite every implementation of a port must pass",
]

[tool.coverage.run]
branch = true
source = ["f1sim"]
omit = []

[tool.coverage.report]
fail_under = 85
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]

# ------------------------------------------------------------------ import-linter (SOLID: DIP/SRP)
[tool.importlinter]
root_package = "f1sim"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layers: entry points > adapters > core"
type = "layers"
layers = [
  "f1sim.cli",
  "f1sim.api | f1sim.reports",
  "f1sim.adapters",
  "f1sim.core",
]

[[tool.importlinter.contracts]]
name = "Core layers: use cases > engine | scoring > ports > domain"
type = "layers"
containers = ["f1sim.core"]
layers = ["usecases", "engine | scoring", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "Core never imports I/O or framework libraries"
type = "forbidden"
source_modules = ["f1sim.core"]
forbidden_modules = [
  "fastf1",
  "duckdb",
  "pymc",
  "jax",
  "statsmodels",
  "numpyro",
  "fastapi",
  "httpx",
  "requests",
  "pandera",
]
