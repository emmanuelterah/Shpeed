[project]
name = "f1sim"
version = "0.0.0"
description = "Shpeed: an open-source, lap-by-lap Monte Carlo F1 race simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Shpeed contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.optional-dependencies]
# Data ingestion and storage (Phase 1)
data = ["fastf1>=3.4", "duckdb>=1.3", "pandera>=0.20", "pyarrow>=16"]
# Statistical models (Phases 3-6). ADR-0003 decides PyMC vs NumPyro.
models = ["pymc>=5.16", "statsmodels>=0.14"]
# Read-only API (Phase 8)
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
f1sim = "f1sim.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "pandas-stubs>=2.2",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1sim"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF", "PT", "PL", "C4", "TID"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ------------------------------------------------------------------ pyright
[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=f1sim --cov-report=term-missing"
markers = [
  "integration: replays recorded source responses; network is blocked",
  "perf: performance benchmarks, run on model and engine PRs",
  "contract: shared test suite every implementation of a port must pass",
]

[tool.coverage.run]
branch = true
source = ["f1sim"]
omit = ["src/f1sim/adapters/*", "src/f1sim/cli.py", "src/f1sim/reports/*"]

[tool.coverage.report]
fail_under = 85
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:", "\\.\\.\\."]

# ------------------------------------------------------------------ import-linter (SOLID: DIP/SRP)
[tool.importlinter]
root_package = "f1sim"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level layers: entry points > adapters > core"
type = "layers"
layers = [
  "f1sim.cli",
  "f1sim.api | f1sim.reports",
  "f1sim.adapters",
  "f1sim.core",
]

[[tool.importlinter.contracts]]
name = "Core layers: use cases > engine | scoring > ports > domain"
type = "layers"
containers = ["f1sim.core"]
layers = ["usecases", "engine | scoring", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "Core never imports I/O or framework libraries"
type = "forbidden"
source_modules = ["f1sim.core"]
forbidden_modules = ["fastf1", "duckdb", "pymc", "numpyro", "fastapi", "httpx", "requests", "pandera"]
