# Circuit reference data (P3-06), keyed by Jolpica circuit ID.
#
# length_km is the lap length of the current layout, rounded; it is only used to turn the
# best qualifying lap into an average speed, which places the circuit in a speed cluster.
# Small layout changes (Barcelona 2023, Singapore 2023, Abu Dhabi 2021) move the average
# speed by a few km/h at most, which does not change a cluster.
#
# Clusters are average qualifying speed bands, in km/h: below `low_below` is "low"
# (Monaco, Singapore, Hungary), at or above `high_from` is "high" (Monza, Spa, Silverstone).

clusters:
  low_below: 210
  high_from: 235

