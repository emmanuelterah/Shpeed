# Shpeed local stack
#
#   docker compose up --build
#     web:  http://localhost:8080        (frontend; /api is proxied to the API)
#     api:  http://localhost:8000/docs   (interactive API docs)
#
# Ports are published on 127.0.0.1 only, so the stack (and the dev server in
# compose.dev.yaml) is reachable from this machine but not from the rest of the network.
# If a port is taken or reserved (common on Windows), pick another on the host side:
#   SHPEED_WEB_PORT=8081 SHPEED_API_PORT=8001 docker compose up --build
# To click through the app with the sample forecasts used by the e2e tests:
#   SHPEED_PREDICTIONS=./frontend/e2e/fixtures/predictions docker compose up
#
# Development with hot reload: see compose.dev.yaml.

name: shpeed

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    image: shpeed-api:local
    environment:
      F1SIM_LOG_LEVEL: INFO
    volumes:
      # Published records are read live from the repo; the API never writes (read-only mount)
      - ${SHPEED_PREDICTIONS:-./predictions}:/app/predictions:ro
    ports:
      - "127.0.0.1:${SHPEED_API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-m", "f1sim.api.healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: runtime
      args:
        VITE_API_URL: /api
    image: shpeed-web:local
    ports:
      - "127.0.0.1:${SHPEED_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
