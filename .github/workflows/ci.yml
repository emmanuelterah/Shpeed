name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - name: Lint (ruff, including Google docstrings and imports at top)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pylint (10/10 required)
        run: |
          uv run pylint src scripts --fail-under=10
          uv run pylint --rcfile=tests/pylintrc tests --fail-under=10
      - name: Line length (every code file, 100 characters)
        run: uv run python scripts/check_line_length.py
      - name: Types (pyright strict, as used by Pylance)
        run: uv run pyright
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests (network blocked by fixtures)
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit
      - name: Package builds and passes PyPI checks
        run: |
          uv build
          uv run twine check --strict dist/*
          uv run check-wheel-contents dist/*.whl

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and smoke-test it
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q "<title>Shpeed</title>"
      - name: Logs and teardown
        if: always()
        run: docker compose logs && docker compose down
