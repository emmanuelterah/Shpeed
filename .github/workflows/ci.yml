name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: Lint (ruff, including Google docstrings and imports at top)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pylint (10/10 required)
        run: |
          uv run pylint src scripts --fail-under=10
          uv run pylint --rcfile=tests/pylintrc tests --fail-under=10
      - name: Line length (every code file, 100 characters)
        run: uv run python scripts/check_line_length.py
      - name: Types (pyright strict, as used by Pylance)
        run: uv run pyright
      - name: Import contracts
        run: uv run lint-imports
      - name: Tests (network blocked by fixtures)
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit
      - name: Package builds and passes PyPI checks
        run: |
          uv build
          uv run twine check --strict dist/*
          uv run check-wheel-contents dist/*.whl

  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras --group research
      - name: Execute the regulation-reset notebook from a clean environment (P7-04)
        run: |
          uv run --group research jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            notebooks/01-regulation-reset.ipynb --output /tmp/regulation-reset.ipynb

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types match the shared schemas (P8-13)
        run: |
          pnpm gen:types
          git diff --exit-code -- src/types || {
            echo "::error::src/types is stale; run pnpm gen:types and commit the result"
            exit 1
          }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # P8-15, P8-16: smoke tests and a WCAG AA scan of every screen, light and dark, on desktop
  # Safari and iPhone viewports (WebKit)
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and smoke-test it
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q "<title>Shpeed</title>"
      - name: Logs and teardown
        if: always()
        run: docker compose logs && docker compose down
