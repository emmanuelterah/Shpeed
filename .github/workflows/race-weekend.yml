# Scheduled race-weekend automation (roadmap P8-06, P8-07).
# Manual trigger only until Phase 8; the schedule is added once the gate for Phase 5 has passed.
name: Race weekend

on:
  workflow_dispatch:
    inputs:
      season:
        required: true
      round:
        required: true
      stage:
        type: choice
        options: [predict, score]

concurrency:
  group: race-weekend-${{ inputs.season }}-${{ inputs.round }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run f1sim data sync --season ${{ inputs.season }}
      - if: inputs.stage == 'predict'
        run: uv run f1sim predict --season ${{ inputs.season }} --round ${{ inputs.round }}
      - if: inputs.stage == 'score'
        run: uv run f1sim report score --season ${{ inputs.season }} --round ${{ inputs.round }}
