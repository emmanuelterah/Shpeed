# Serves the built frontend and proxies /api/* to the API service.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The policy is built in parts to keep each line short; nginx joins them into one header
    set $csp "default-src 'self'; img-src 'self' data:; ";
    set $csp "${csp}style-src 'self' 'unsafe-inline'; connect-src 'self'";
    add_header Content-Security-Policy $csp always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change, so cache them for a year
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths fall back to index.html, which is never cached
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
